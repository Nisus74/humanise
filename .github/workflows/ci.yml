name: humanise CI

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Held-in regression suite (the acceptance gate)
        run: |
          cd skill/evals/assertions
          python3 selftest.py
