name: humanise CI

on:
  push:
  pull_request:

# Least privilege: the selftest only needs to read the repo.
permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Held-in regression suite (the acceptance gate)
        run: |
          cd skill/evals/assertions
          python3 selftest.py
