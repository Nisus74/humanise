name: Quality

on:
  push:
  pull_request:

# Least privilege: the selftest only needs to read the repo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Run contributor quality gate
        run: npm run quality
      - name: Install and run the actual package
        run: |
          TARBALL="$(npm pack --ignore-scripts --silent --cache "$RUNNER_TEMP/npm-cache")"
          CONSUMER="$(mktemp -d)"
          trap 'rm -rf -- "$CONSUMER" "$TARBALL"' EXIT
          npm install --prefix "$CONSUMER" "./$TARBALL" --ignore-scripts --no-package-lock \
            --cache "$RUNNER_TEMP/consumer-cache"
          EXPECTED="humanise $(node -p "require('./package.json').version")"
          ACTUAL="$(node "$CONSUMER/node_modules/humanise/cli/bin/cli.js" version)"
          test "$ACTUAL" = "$EXPECTED"
