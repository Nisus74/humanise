name: codeql

on:
  push:
  pull_request:

# CodeQL needs to read the code and the workflow, and write its findings.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning needs a public repo (free) or GitHub Advanced Security, so
    # this auto-skips while the repo is private and runs once it is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python] # JS covers the CLI; python covers the checker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Analyse
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
