name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly (Mon 06:00 UTC); re-scans dormant branches for newly disclosed issues

# CodeQL needs to read the code and the workflow, and write its findings.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning runs on any non-private repo: public (free), or internal/private
    # with GitHub Advanced Security. Auto-skips while private, runs once public (the
    # weekly schedule above skips too while private). Keep this guard in sync with
    # dependency-review in security.yml. Don't make this a required status check while
    # private: a skipped job never reports success and would block every PR.
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python] # JS covers the CLI; python covers the checker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Analyse
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
