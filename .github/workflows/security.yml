name: Security

on:
  push:
  pull_request:

# Least privilege: these jobs only need to read the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history, so gitleaks scans past commits too
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Free for public repos. Private or org repos need a GITLEAKS_LICENSE secret.

  dependency-review:
    # Flags vulnerable or newly added dependencies on pull requests. Runs on any
    # non-private repo: public (free), or internal/private with GitHub Advanced
    # Security. Auto-skips while private, runs once public. Keep this guard in sync
    # with the analyze job in codeql.yml. Don't make this a required status check
    # while private: a skipped job never reports success and would block every PR.
    if: github.event_name == 'pull_request' && github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
