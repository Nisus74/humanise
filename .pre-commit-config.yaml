# Pre-commit hooks for humanise. Catches secrets before they reach git history.
# One-time setup after cloning:  pre-commit install
# Update hook versions:          pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-new-deps
        name: zero-dependency check
        entry: node scripts/check-no-deps.mjs
        language: system
        pass_filenames: false
        always_run: true
