# Pre-commit hooks for humanise. Catches secrets before they reach git history.
# One-time setup after cloning:
# pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-new-deps
        name: zero-dependency check
        entry: node scripts/check-no-deps.mjs
        language: system
        pass_filenames: false
        always_run: true
      - id: humanise-quality
        name: humanise quality gate
        entry: npm run quality
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
